{% extends "base.html" %}

{% block content %}
<div class="card form-container">
    <h2>Request a Service</h2>
    <p>Describe your problem and we'll find the best provider for you.</p>
    
    <form action="{{ url_for('main.submit_request') }}" method="POST">
        <div class="form-group">
            <label for="problem">What seems to be the problem?</label>
            <textarea id="problem" name="problem" rows="4" required placeholder="e.g. My AC is running but the house isn't getting cold."></textarea>
        </div>
        
        <div class="form-group">
            <label for="location">Location (City, State)</label>
            <input type="text" id="location" name="location" required placeholder="e.g. Columbus, OH">
        </div>
        
        <div class="form-group">
            <label for="preferred_date">Preferred Date</label>
            <input type="text" id="preferred_date" name="preferred_date" required placeholder="e.g. Tomorrow">
        </div>
        
        <div class="form-group">
            <label for="preferred_time">Preferred Time</label>
            <select id="preferred_time" name="preferred_time" required>
                <option value="">Select a time</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Find Providers</button>
    </form>
</div>
{% endblock %}
