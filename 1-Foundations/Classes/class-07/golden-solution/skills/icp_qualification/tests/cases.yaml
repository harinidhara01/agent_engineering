# Evaluation cases for the ICP Qualification Skill.
# These are semantic evaluation cases (Book 1 §6.6) — they check whether
# the *reasoning* is correct, which requires a live model call to score.
# They are distinct from the deterministic contract tests in
# tests/unit/, which check structure, not judgment.
cases:
  - account_ref: acme-001
    expected_outcome: QUALIFY
    must_mention:
      - manufacturing
      - "22,000"
      - united_states
    must_not_mention:
      - a fabricated employee count different from 22,000

  - account_ref: brightleaf-002
    expected_outcome: DO_NOT_QUALIFY
    must_mention:
      - financial_services
      - excluded
    must_not_mention:
      - a qualifying recommendation

  - account_ref: meridian-003
    expected_outcome: NEEDS_RESEARCH
    must_mention:
      - unknown
      - employee count
    must_not_mention:
      - a guessed or fabricated employee count
      - treating the vague modernization note as decisive
